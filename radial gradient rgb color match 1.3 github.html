<html>
  <head>
<meta name="viewport" 
content="width=device-width,
         height=device-height, 
         initial-scale=1.0">

    <title>radial-gradient</title>
    <style>
*{margin:0px;padding:0px;}
    body{
      background-color: rgb(0,0,0);
      color: lime;
} 
h2{
  animation:colores 7s 1s linear infinite;
  user-select: none ;
}
@keyframes colores{
  from{
   filter: hue-rotate(0deg);
  }to{
    filter: hue-rotate(360deg);
  }
}
.displaying {
  width: 100%;
  height: 100px;
  user-select:none ;
}

button{
  width: calc(100%/6.3);
  height: 50px ;
  background-color:blue ;
  border: 2px solid white ;
  color: white ;
  font-size: 20px ;
  user-select: none ;
}
#circle{
  position: absolute ;
  width: 300px;
  height: 300px;
  left: 50%;
  top: 0px;
  transform: translate(-50%,0%);
  border-radius: 50%;
  border: 2px solid transparent ;
  
}
#space{
  height: 400px;
}

#r2minus, #r2plus, #g2minus, #g2plus, #b2minus, #b2plus{
  width: calc(100% / 6);
}
#buttons2{
  position: absolute ;
  left: 0px ;
  bottom: 0px ;
  width: 100%;
  height: 50px;;
  display:flex;
  justify-content: space-between ;
}
#div2{
  position: absolute ;
  bottom: 50px ;
}

#r1minus, #r1plus, #g1minus, #g1plus, #b1minus, #b1plus{
  width: calc(100% / 6);
}
#buttons1{
  position: absolute ;
  left: 0px ;
  bottom: 150px ;
  width: 100%;
  height: 50px;;
  display:flex;
  justify-content: space-between ;
}
#div1{
  position: absolute ;
  bottom: 200px ;
}
#r1minus, #r1plus,#r2minus,#r2plus{
  background-color:red;
}
#g1minus, #g1plus,#g2minus,#g2plus{
  background-color:green;
}
#b1minus, #b1plus,#b2minus,#b2plus{
  background-color:blue;
}
    </style>
  </head>
  <body>
    
    
    <div id="space"></div>
<div id="circle"></div>
    
<div id="div1" class="displaying"></div>

<div id="buttons1">
<button id="r1minus"></button>
<button id="r1plus"></button>
<button id="g1minus"></button>
<button id="g1plus"></button>
<button id="b1minus"></button>
<button id="b1plus"></button>
</div>

<div id="div2" class="displaying"></div>

<div id="buttons2">
<button id="r2minus"></button>
<button id="r2plus"></button>
<button id="g2minus"></button>
<button id="g2plus"></button>
<button id="b2minus"></button>
<button id="b2plus"></button>
</div>






<script>
  let countdown = 60

let r1 = 0 
let g1 = 0
let b1 = 0 
let forR1
let forG1
let forB1
let r2 = 0 
let g2 = 0 
let b2 = 0 
let forR2
let forG2
let forB2

let radial1 = null 
let radial2 = null

let chosenradial2 = null

setInterval(()=>{
  div1.style.background = `rgb(${r1}, ${g1}, ${b1}) `
  //rgb1.innerHTML = `rgb(${r1}, ${g1}, ${b1}) `
  
  div2.style.background = `rgb(${r2}, ${g2}, ${b2}) `

 // counter.innerHTML = countdown

   // counter.innerHTML = radial1 +"/ "+ radial2
  }
}, 100)

   radial1 = `rgb(${Math.floor(Math.random()*256)}, 
                  ${Math.floor(Math.random()*256)},

   radial2 = `rgb(${Math.floor(Math.random()*256)}, 
                  ${Math.floor(Math.random()*256)}, 
                  ${Math.floor(Math.random()*256)}) `
  circle.style.background = `radial-gradient(circle at 50% 50%,${radial1}, ${radial2}) `
}
//newradial()

})

})

function incrementR1no(){

function incrementB1no(){

r1minus.addEventListener('touchend', decrementR1no)
r1plus.addEventListener('touchstart', incrementR1)
r1plus.addEventListener('touchend', incrementR1no)

g1minus.addEventListener('touchend', decrementG1no)

b1plus.addEventListener('touchstart', incrementB1)
b1plus.addEventListener('touchend', incrementB1no)
